name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the previous run for the same ref; cancel it rather
# than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Typecheck, build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` over `npm install`: installs exactly the lockfile and fails if
      # package.json and the lock have drifted.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck (server)
        run: npm run typecheck -w geocoding-server

      - name: Unit tests (server)
        run: npm test -w geocoding-server

      - name: Component tests (web)
        run: npm test -w geocoding-web

      # The web build runs tsc -b first, so this typechecks the UI as well as
      # producing the bundle.
      - name: Build (server and web)
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  integration:
    name: Migration and ingest against Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: geocoding
          POSTGRES_PASSWORD: geocoding
          POSTGRES_DB: geocoding
        ports:
          - 5432:5432
        # The job starts as soon as the container is up; without this, the first
        # migration races Postgres' own initialisation and fails intermittently.
        options: >-
          --health-cmd "pg_isready -U geocoding -d geocoding"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://geocoding:geocoding@localhost:5432/geocoding

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write .env
        run: cp .env.example .env

      - name: Run migrations
        run: npm run db:migrate

      # The runner applies migrations to an empty database every time, so this
      # is the only place the "already applied" path is exercised.
      - name: Migrations are idempotent
        run: |
          output=$(npm run db:migrate 2>&1)
          echo "$output"
          echo "$output" | grep -q "schema up to date" \
            || { echo "::error::second migration run was not a no-op"; exit 1; }

      # Ingest the committed fixture rather than fetching from GeoNames: no
      # network flake, no unnecessary load on a free public dataset, and the
      # row counts are known so they can be asserted.
      - name: Ingest sample dataset
        run: npm run db:ingest -w geocoding-server -- --sample

      - name: Ingest reports the expected counts
        run: |
          output=$(npm run db:ingest -w geocoding-server -- --sample 2>&1)
          echo "$output"
          echo "$output" | grep -q "9 upserted" \
            || { echo "::error::expected 9 upserted rows"; exit 1; }
          echo "$output" | grep -q "skipped 3 — no_state_code" \
            || { echo "::error::expected 3 APO/FPO rows to be skipped"; exit 1; }

      # Asserts the invariants the API depends on, including that both query
      # shapes still reach an index — a lost index passes every functional test
      # and only surfaces as latency in production.
      - name: Verify schema, indexes and query plans
        run: npm run db:verify -w geocoding-server -- --expect-rows 9

      # Boots the same app factory main.ts uses and drives it through Fastify's
      # inject, so the global prefix and validation pipe under test are the ones
      # that ship. Runs against the fixture loaded above.
      - name: API integration tests
        run: npm run test:integration -w geocoding-server
